################################################################################
# Les Houches model: model-specific closure test with UltraNest
#
# The pseudodata are generated from the Les Houches model itself, with the
# parameter values below (best fit of Alekhin et al., hep-ph/0511119), rather
# than from an LHAPDF set.
#
# Run with:      les_houches_exe runcards/lh_closure_test_model.yaml
# Output folder (created in the current directory): lh_closure_test_model/
# Evolve with:   evolve_fit lh_closure_test_model
################################################################################

meta: 'Les Houches model: UltraNest fit to pseudodata generated by the Les Houches model itself.'

#######################
# Data and theory specs
#######################

dataset_inputs:
# DIS
- {dataset: SLAC_NC_NOTFIXED_P_EM-F2, variant: legacy_dw}
- {dataset: SLAC_NC_NOTFIXED_D_EM-F2, variant: legacy_dw}
- {dataset: BCDMS_NC_NOTFIXED_P_EM-F2, variant: legacy_dw}
- {dataset: BCDMS_NC_NOTFIXED_D_EM-F2, variant: legacy_dw}
# - {dataset: CHORUS_CC_NOTFIXED_PB_NU-SIGMARED, variant: legacy_dw}
# - {dataset: CHORUS_CC_NOTFIXED_PB_NB-SIGMARED, variant: legacy_dw}
# - {dataset: NUTEV_CC_NOTFIXED_FE_NU-SIGMARED, cfac: [MAS], variant: legacy_dw}
# - {dataset: NUTEV_CC_NOTFIXED_FE_NB-SIGMARED, cfac: [MAS], variant: legacy_dw}
# - {dataset: HERA_NC_318GEV_EM-SIGMARED, variant: legacy}
# - {dataset: HERA_NC_225GEV_EP-SIGMARED, variant: legacy}
# - {dataset: HERA_NC_251GEV_EP-SIGMARED, variant: legacy}
# - {dataset: HERA_NC_300GEV_EP-SIGMARED, variant: legacy}
# - {dataset: HERA_NC_318GEV_EP-SIGMARED, variant: legacy}
# - {dataset: HERA_CC_318GEV_EM-SIGMARED, variant: legacy}
# - {dataset: HERA_CC_318GEV_EP-SIGMARED, variant: legacy}
# - {dataset: HERA_NC_318GEV_EAVG_CHARM-SIGMARED, variant: legacy}
# - {dataset: HERA_NC_318GEV_EAVG_BOTTOM-SIGMARED, variant: legacy}
# - {dataset: NMC_NC_NOTFIXED_EM-F2, variant: legacy_dw}
# - {dataset: NMC_NC_NOTFIXED_P_EM-SIGMARED, variant: legacy}

theoryid: 40000000                     # The theory from which the predictions are drawn.
use_cuts: internal                     # The kinematic cuts to be applied to the data.

closure_test_level: 0                  # 0: pseudodata without noise; 1: pseudodata with noise.
closure_test_pdf: colibri_model        # Generate the pseudodata with a colibri model.
closure_test_model_settings:
  model: les_houches_example           # Name of the installed colibri model package.
  parameters:                          # One value per model parameter.
    alpha_gluon: 0.356
    beta_gluon: 10.9
    alpha_up: 0.718
    beta_up: 3.81
    epsilon_up: -1.56
    gamma_up: 3.30
    alpha_down: 1.71
    beta_down: 10.0
    epsilon_down: -3.83
    gamma_down: 4.64
    norm_sigma: 0.211
    alpha_sigma: -0.048
    beta_sigma: 2.20

#####################
# Loss function specs
#####################

positivity:                            # Positivity datasets, used in the positivity penalty.
  posdatasets:
  - {dataset: NNPDF_POS_2P24GEV_F2U, variant: None, maxlambda: 1e6}

positivity_penalty_settings:
  positivity_penalty: false
  alpha: 1e-7
  lambda_positivity: 0

integrability_settings:
  integrability: false

use_t0_covmat: true                    # Use the t0 covariance matrix in the chi2.
t0pdfset: NNPDF40_nnlo_as_01180        # The PDF used to build the t0 covariance matrix.

###################
# Methodology specs
###################

prior_settings:
  prior_distribution: uniform_parameter_prior
  prior_distribution_specs:
    bounds:
      alpha_gluon: [-0.1, 1]
      beta_gluon: [9, 13]
      alpha_up: [0.4, 0.9]
      beta_up: [3, 4.5]
      epsilon_up: [-3, 3]
      gamma_up: [1, 6]
      alpha_down: [1, 2]
      beta_down: [8, 12]
      epsilon_down: [-4.5, -3]
      gamma_down: [3.8, 5.8]
      norm_sigma: [0.1, 0.5]
      alpha_sigma: [-0.2, 0.1]
      beta_sigma: [1.2, 3]

ultranest_settings:
  ultranest_seed: 123456
  sampler_plot: true
  n_posterior_samples: 100             # Number of posterior samples (replicas) written out.
  posterior_resampling_seed: 123456
  ReactiveNS_settings:                 # Any ultranest.ReactiveNestedSampler option.
    vectorized: false
    ndraw_max: 500                     # Maximum number of points to propose at once.
  Run_settings:                        # Any ReactiveNestedSampler.run option.
    min_num_live_points: 200           # Minimum number of live points throughout the run.
    min_ess: 50                        # Target number of effective posterior samples.
    frac_remain: 0.3                   # Stop when this fraction of the integral is left.
  SliceSampler_settings:
    nsteps: 106                        # Accepted steps before a sample counts as independent.

actions_:
- run_ultranest_fit
